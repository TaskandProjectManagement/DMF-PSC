   if(!dl||!window.html2canvas||!window.jspdf){toast('“บันทึก Grid” แบบนี้ต้องใช้การดาวน์โหลดไฟล์ ลองเมนู "งานทั้งหมด" หรือ "รายบุคคล" แทนได้');return}
   btn.textContent='⏳ กำลังสร้าง PDF…';
   const scEl=document.getElementById('sc'),innerEl=scEl.querySelector('.inner')||scEl.querySelector('.calw');
   if(!innerEl){toast('ไม่พบตารางให้บันทึก');return}
   const st0=scEl.scrollTop;scEl.scrollTop=0;await new Promise(r=>requestAnimationFrame(()=>r()));
   let full;
   try{const area=innerEl.scrollWidth*innerEl.scrollHeight,sc2=Math.max(0.8,Math.min(1.6,Math.sqrt(36e6/area)));
    const iR=innerEl.getBoundingClientRect(),hdr=innerEl.querySelector('.hd,.cleg'),hdrH=view=='cal'?0:(hdr?hdr.offsetHeight:0);
    const cuts=[...innerEl.querySelectorAll(view=='cal'?'.cday':'.row')].map(e=>Math.round(e.getBoundingClientRect().bottom-iR.top));
    full=await html2canvas(innerEl,{scale:sc2,backgroundColor:'#fff',ignoreElements:e=>!!(e.classList&&(e.classList.contains('ed')||e.id=='hdOrd'))});
    const sx=view=='cal'?0:Math.round(scEl.scrollLeft*sc2),vw=view=='cal'?full.width:Math.min(Math.round(scEl.clientWidth*sc2),full.width-sx),fullH=full.height;
    const{jsPDF}=window.jspdf,pdf=new jsPDF('l','pt','a4'),pageW=pdf.internal.pageSize.getWidth(),pageH=pdf.internal.pageSize.getHeight(),mg=20,k=(pageW-mg*2)/vw;
    let k2=k;if(view=='cal'&&fullH*k>pageH-mg*2)k2=(pageH-mg*2)/fullH;
    const hh=Math.round(hdrH*sc2),bodyMax=Math.floor((pageH-mg*2)/k2)-hh;
    let y=hh,first=true;
    while(y<fullH-2){let end=Math.min(fullH,y+bodyMax);if(end<fullH){const c=cuts.map(v=>v*sc2).filter(v=>v>y+bodyMax*0.4&&v<=end).pop();if(c)end=Math.round(c)}
     const h=end-y,pc=document.createElement('canvas');pc.width=vw;pc.height=hh+h;const g=pc.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,pc.width,pc.height);
     if(hh)g.drawImage(full,sx,0,vw,hh,0,0,vw,hh);g.drawImage(full,sx,y,vw,h,0,hh,vw,h);
     if(!first)pdf.addPage();first=false;pdf.addImage(pc.toDataURL('image/jpeg',0.9),'JPEG',mg,mg,vw*k2,(hh+h)*k2);y=end;if(view=='cal')break}
    if(view=='cal'&&first){pdf.addImage(full.toDataURL('image/jpeg',0.9),'JPEG',mg,mg,full.width*k2,fullH*k2)}
    var gridPdf=pdf}
   finally{scEl.scrollTop=st0}
   const pdf=gridPdf;
   await dl.save({filename:(view=='cal'?'ปฏิทิน-':'ตารางงานทีม-กริด-')+label(view=='cal'?anchor:centerD()).replace(/\s+/g,'-')+'.pdf',data:pdf.output('blob')});
   return}
  const built=mode=='person'?buildPrintablePerson():buildPrintable();
  if(dl&&window.html2canvas&&window.jspdf){
   btn.textContent='⏳ กำลังสร้าง PDF…';
   await buildListPDF(built.header,built.blocks,(mode=='person'?'ตารางงานทีม-รายบุคคล.pdf':'ตารางงานทีม.pdf'),dl);
  }else{
   let pa=document.getElementById('printArea');
   if(!pa){pa=document.createElement('div');pa.id='printArea';document.body.appendChild(pa)}
   pa.innerHTML=built.header+built.blocks.join('');
   const old2=document.title;document.title='ตารางงานทีม '+iso(Math.floor(now()));
   window.print();
   setTimeout(()=>{document.title=old2},1000);
  }
 }catch(e){if(!(e&&e.code=='declined'))toast('บันทึก PDF ไม่สำเร็จ: '+((e&&(e.code||e.message))||e))}
 finally{btn.disabled=false;btn.textContent=old}
}
async function getDL(){try{return window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){return null}}
async function exportBackup(){
 try{const data={app:'teamboard',version:1,exportedAt:new Date().toISOString(),title:boardTitle,people,tags,pcolors:pcMap,tasks:tasks.map(t=>({...t}))};
  const txt=JSON.stringify(data,null,1),fn='สำรอง-'+boardTitle.replace(/[\\/:*?"<>|]/g,'_')+'-'+iso(Math.floor(now()))+'.json',dl=await getDL();
  if(dl)await dl.save({filename:fn,data:txt});
  else{const u=URL.createObjectURL(new Blob([txt],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}

function importBackup(){
 if(!canW)return;const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
 inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;let d;
  try{d=JSON.parse(await f.text())}catch(e){toast('อ่านไฟล์ไม่ได้ ไม่ใช่ไฟล์สำรองที่ถูกต้อง');return}
  if(!d||!Array.isArray(d.tasks)){toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของบอร์ดนี้');return}
  const ok=d.tasks.filter(t=>t&&typeof t=='object'&&typeof t.title=='string'&&typeof t.id=='string'&&/^[A-Za-z0-9_-]{1,100}$/.test(t.id));
  const ids=new Set(tasks.map(t=>t.id)),miss=ok.filter(t=>!ids.has(t.id)),same=ok.filter(t=>ids.has(t.id)&&canon(tasks.find(x=>x.id==t.id))!==canon(t));
  const m=modal(`<h2>นำเข้าไฟล์สำรอง</h2><p class="hint">ไฟล์: ${esc(f.name)}${d.exportedAt?' · สร้างเมื่อ '+esc(new Date(d.exportedAt).toLocaleString('th-TH')):''}</p>
   <div class="kv"><span>งานในไฟล์</span><div>${ok.length} งาน</div></div>
   <div class="kv"><span>งานที่ไม่มีในบอร์ด</span><div><b>${miss.length}</b> งาน (เช่น งานที่เผลอลบไป)</div></div>
   <div class="kv"><span>งานที่ข้อมูลต่างจากในบอร์ด</span><div><b>${same.length}</b> งาน</div></div>
   <p class="hint">การนำเข้าจะ<b>ไม่ลบ</b>งานใดๆ ที่อยู่ในบอร์ด รายชื่อทีมและแท็กจะถูกเพิ่มเฉพาะชื่อที่ยังไม่มี</p>
   <div class="ft"><span class="sp"></span><button class="ghost" id="cx">ยกเลิก</button><button id="imMiss" class="pri">กู้คืนเฉพาะงานที่ไม่มี (${miss.length})</button>${same.length?`<button id="imAll" class="danger">กู้คืน + เขียนทับ ${same.length} งาน</button>`:''}</div>`);
  const run=async list=>{m.querySelectorAll('button').forEach(b=>b.disabled=true);let n2=0;
   for(const t of list){const{id,...rec}=t;try{if(db)await db.doc('tasks/'+id).set(rec);else{tasks=tasks.filter(x=>x.id!=id).concat([{id,...rec}])}n2++}catch(e){if(handleWriteErr(e))break}}
   const np=(Array.isArray(d.people)?d.people:[]).filter(x=>typeof x=='string'&&!people.includes(x));if(np.length)await savePeople([...people,...np]);
   const nt=(Array.isArray(d.tags)?d.tags:[]).filter(x=>typeof x=='string'&&!tags.includes(x));if(nt.length)await saveTags([...tags,...nt]);
   logAct('นำเข้าไฟล์สำรอง',n2+' งาน');m.remove();render();toast('นำเข้าแล้ว '+n2+' งาน')};
  m.querySelector('#imMiss').onclick=()=>run(miss);
  const ia=m.querySelector('#imAll');if(ia)ia.onclick=async()=>{if(await askConfirm('เขียนทับ '+same.length+' งานด้วยข้อมูลจากไฟล์สำรอง? การแก้ไขล่าสุดของงานเหล่านี้จะหายไป'))run([...miss,...same])}};
 inp.click()}
